name: Build ALLO AZIZ APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and required packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          cd /tmp

          if [ ! -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Downloading Android command line tools..."
            curl -fsSL -o commandlinetools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"

            rm -rf /tmp/cmdline-tools
            unzip -q commandlinetools.zip -d /tmp/cmdline-tools

            rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            cp -R /tmp/cmdline-tools/cmdline-tools/* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"
          fi

          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          echo "Using sdkmanager: $(which sdkmanager)"
          sdkmanager --version

          attempt=0
          max_attempts=3
          until [ "$attempt" -ge "$max_attempts" ]; do
            attempt=$((attempt+1))
            echo "Attempt $attempt/$max_attempts: installing Android packages"
            if yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
              --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"; then
              echo "Android packages installed successfully"
              break
            fi
            echo "Install attempt failed — retrying in 5s"
            sleep 5
          done

          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLO-AZIZ-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
