name: Build ALLO AZIZ APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses and Prepare Tools
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          echo "Setting up Android SDK environment..."
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          
          # Find sdkmanager in pre-installed cmdline-tools
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f -perm /111 2>/dev/null | sort -V | tail -n 1 || true)
          
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found in cmdline-tools, downloading official command-line tools..."
            mkdir -p /tmp/cmdline-tools
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            cp -r /tmp/cmdline-tools/cmdline-tools/* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/" || true
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          
          echo "Using sdkmanager at: ${SDKMANAGER}"
          
          # Accept licenses
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          
          # Install required SDK platform and build tools if missing
          echo "Ensuring platforms;android-36 and build-tools;36.0.0..."
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLO-AZIZ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
